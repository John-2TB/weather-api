<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>AETHERIS</title>
</head>
<body>
  <header>
    <video autoplay muted loop playsinline src="./public/sunny.mp4" id="header-video"></video>

    <div class="hero-overlay"></div>

    <div class="hero-content">
      <h1>AETHERIS</h1>
      <p>Discover information about the world around you</p>
      <div class="search-container">
        <input type="text" placeholder="Search for a city..." id="location">
        <button id="search">Search</button>
        <div id="suggestions">

          

        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <h2 id="locationDisplay"><span></span> City, Country</h2>

    <div class="info-section">
      <!-- Weather Section -->
      <section class="weather-section">
        <h3>Current Condition</h3>
        <div class="current-weather-info">

          <div>
            <p>Temperature</p>
            <p id="temperature"></p>
            <p id="apparent-temperature"></p>
          </div>

          <div class="weather-info">
            <p>Humidity</p>
            <p id="humidity"></p>
            <div>
              <p>Dew Point</p>
              <p id="dew-point"></p>
            </div>
          </div>

          <div class="weather-info">
            <p>Wind</p>
            <p id="wind"></p>
            <div>
              <p>Direction</p>
              <p id="direction"></p>
            </div>
          </div>

          <div class="weather-info">
            <p>Pressure</p>
            <p id="pressure"></p>
            <div>
              <p>Visibility</p>
              <p id="visibility"></p>
            </div>
          </div>
        </div>
      </section>

      <!-- City Section -->
      <section class="city-section">
        <h3>City Insights</h3>

        <div class="city-insight-info">
          <div>
            <p>Geographic Coordinates</p>
            <p id="coordinates"></p>
            <p id="elevation"></p>
          </div>

          <div>
            <p>Country & Region</p>
            <p id="location"></p>
            <p id="timezone"></p>
          </div>

          <div>
            <p>Demographics </p>
            <p id="population"></p>
          </div>
        </div>

      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
