<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>AETHERIS</title>
</head>
<body>
  <header>
    <video autoplay muted loop playsinline>
      <source src="./public/sunny.mp4" type="video/mp4">
    </video>

    <div class="hero-overlay"></div>

    <div class="hero-content">
      <h1>AETHERIS</h1>
      <p>Discover information about the world around you</p>
      <div class="search-container">
        <input type="text" placeholder="Search for a city..." id="location">
        <button id="search">Search</button>
      </div>
    </div>
  </header>

  <main>
    <h2><span></span> City, Country</h2>

    <div class="info-section">
      <!-- Weather Section -->
      <section class="weather-section">
        <h3>Current Condition</h3>
        <div class="current-weather-info">

          <div>
            <p>Temperature</p>
            <p></p>
          </div>

          <div>
            <p>Humidity</p>
            <p></p>
          </div>

          <div>
            <p>Wind</p>
            <p></p>
          </div>
        </div>
      </section>

      <!-- City Section -->
      <section class="city-section">
        <h3>City Insights</h3>

        <div class="city-insight-info">
          <div>
            <p>Geographic Location</p>
          </div>
        </div>

      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
